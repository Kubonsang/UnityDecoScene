<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>빠른 공간 캘리브레이션 검수</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1319;
      --panel: #141b23;
      --panel-2: #19222d;
      --panel-3: #10161d;
      --line: #344150;
      --line-soft: #26313d;
      --text: #edf2f7;
      --muted: #9aa8b8;
      --green: #62cf68;
      --green-bg: #143b27;
      --red: #ff5c5c;
      --red-bg: #482124;
      --gray: #a5afbb;
      --blue: #68aaff;
      --amber: #ffb02e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    button, input { font: inherit; }
    button { color: inherit; }
    header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; min-height: 64px; padding: 12px 20px; background: #0d131aec; border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
    header h1 { margin: 0; font-size: 19px; letter-spacing: -.2px; }
    header p { margin: 0; color: var(--muted); }
    .header-state { margin-left: auto; color: var(--muted); white-space: nowrap; }
    .header-state b { color: var(--text); }
    main { max-width: 1560px; margin: auto; padding: 14px; }
    .overview { margin-bottom: 12px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .overview-head { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--panel-3); border-bottom: 1px solid var(--line); }
    .overview-title { padding: 12px 16px; font-weight: 750; text-align: center; border-right: 1px solid var(--line); }
    .overview-title:last-child { border-right: 0; }
    .overview-title.approval { color: var(--green); }
    .overview-title.revision { color: var(--red); }
    .overview-title.undecided { color: #c0c9d3; }
    .overview-columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); min-height: 203px; max-height: 203px; overflow: hidden; }
    .overview-list { margin: 0; padding: 0; list-style: none; border-right: 1px solid var(--line); overflow: auto; }
    .overview-list:last-child { border-right: 0; }
    .overview-row { width: 100%; display: flex; align-items: center; gap: 9px; min-height: 28px; padding: 4px 14px; color: #d4dde7; background: transparent; border: 0; border-bottom: 1px dashed var(--line-soft); text-align: left; cursor: pointer; }
    .overview-row:hover, .overview-row.selected { background: #202b37; }
    .overview-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .overview-row.revision { color: var(--red); }
    .overview-empty { display: grid; min-height: 90px; place-items: center; color: #697686; }
    .dot { width: 10px; height: 10px; flex: 0 0 auto; border-radius: 50%; background: var(--gray); }
    .dot.approval { background: var(--green); }
    .dot.revision { background: var(--red); }
    .workspace { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 12px; align-items: stretch; }
    .inbox, .detail, .action-bar { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .inbox { min-height: 510px; padding: 14px 12px; }
    .inbox h2 { margin: 0 0 12px; padding: 0 4px 12px; border-bottom: 1px solid var(--line); font-size: 17px; }
    .group { padding: 10px 0 8px; border-bottom: 1px solid var(--line); }
    .group:last-child { border-bottom: 0; }
    .group-head { display: flex; align-items: center; gap: 8px; padding: 0 5px 8px; font-weight: 750; }
    .group-head .count { margin-left: auto; color: var(--muted); font-weight: 600; }
    .inbox-list { display: grid; gap: 3px; }
    .inbox-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: transparent; border: 1px solid transparent; border-radius: 7px; text-align: left; cursor: pointer; }
    .inbox-row:hover { background: #1b2530; }
    .inbox-row.selected { background: #1c2b3d; border-color: var(--blue); }
    .inbox-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inbox-empty { padding: 8px 10px; color: #6f7b89; }
    .detail { min-width: 0; min-height: 510px; padding: 12px 16px 16px; }
    .state-banner { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-3); font-weight: 750; }
    .state-banner.approval { color: var(--green); border-color: #2f8444; background: #123221; }
    .state-banner.revision { color: #ff8585; border-color: #8a343a; background: #32191b; }
    .state-banner.undecided { color: #c7d0da; }
    .case-head { display: flex; align-items: flex-start; gap: 12px; margin: 0 2px 14px; }
    .case-head h2 { margin: 0 0 3px; font-size: 23px; line-height: 1.2; }
    .case-head small { color: var(--muted); }
    .status { margin-left: auto; padding-top: 4px; color: var(--amber); }
    .mode { display: flex; gap: 7px; }
    .mode button, .action-button { border: 1px solid var(--line); border-radius: 7px; background: #1d2631; padding: 8px 13px; cursor: pointer; }
    .mode button:hover, .action-button:hover { filter: brightness(1.12); }
    .mode button.active { border-color: var(--blue); color: #d6e8ff; }
    .family { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: 0 0 12px; padding: 8px 10px; color: var(--muted); background: var(--panel-3); border: 1px solid var(--line-soft); border-radius: 7px; }
    .family strong { color: #d7e8fb; }
    .variant { padding: 2px 7px; border: 1px solid #3a4859; border-radius: 999px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .view { min-width: 0; margin: 0; }
    .view figcaption { margin-bottom: 7px; color: #bcc6d1; text-align: center; }
    .view img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: #0a0f14; border: 1px solid var(--line); border-radius: 8px; }
    .measurements { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .metric { padding: 9px 8px; overflow: hidden; color: var(--muted); background: var(--panel-3); border: 1px solid var(--line-soft); border-radius: 7px; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    .metric b { color: var(--text); }
    .notice { margin: 10px 2px 0; color: var(--muted); }
    .action-bar { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(170px, .7fr) minmax(170px, .7fr) minmax(150px, .6fr); gap: 12px; align-items: stretch; margin-top: 12px; padding: 14px; }
    .review-check { display: flex; align-items: center; gap: 12px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-3); cursor: pointer; }
    .review-check input { width: 22px; height: 22px; flex: 0 0 auto; accent-color: var(--blue); }
    .review-check strong { display: block; font-size: 16px; }
    .review-check span { display: block; color: var(--muted); font-size: 12px; }
    .review-note { grid-column: 1 / -1; display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 12px; align-items: center; color: var(--muted); }
    .review-note strong { display: block; color: var(--text); }
    .review-note textarea { width: 100%; min-height: 58px; resize: vertical; padding: 10px 12px; color: var(--text); background: var(--panel-3); border: 1px solid var(--line); border-radius: 7px; outline: none; }
    .review-note textarea:focus { border-color: var(--blue); }
    .action-error { color: var(--red) !important; }
    .decision { border: 1px solid var(--line); border-radius: 8px; background: #1c2530; font-size: 16px; font-weight: 800; cursor: pointer; }
    .decision.approval { color: #effff2; border-color: #36854a; background: #235f33; }
    .decision.revision { color: #fff4f4; border-color: #bc3d3d; background: #9e2929; }
    .decision:disabled { opacity: .34; cursor: not-allowed; filter: none; }
    .decision:hover:not(:disabled) { filter: brightness(1.12); }
    .finalize { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; min-height: 48px; padding-top: 2px; border-top: 1px solid var(--line-soft); }
    .finalize span { color: var(--muted); }
    .finalize button { margin-left: auto; min-width: 250px; padding: 11px 16px; color: #effff2; background: #235f33; border: 1px solid #36854a; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .finalize button:disabled { opacity: .34; cursor: not-allowed; }
    .empty { display: grid; min-height: 480px; place-items: center; color: var(--muted); }
    @media (max-width: 1120px) {
      .workspace { grid-template-columns: 250px minmax(0, 1fr); }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .measurements { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; gap: 4px; }
      .header-state { margin-left: 0; }
      .overview-head, .overview-columns { grid-template-columns: 1fr; max-height: none; }
      .overview-title, .overview-list { border-right: 0; }
      .overview-title { border-bottom: 1px solid var(--line); }
      .workspace { grid-template-columns: 1fr; }
      .inbox { min-height: auto; }
      .action-bar { grid-template-columns: 1fr; }
      .finalize { grid-column: 1; flex-wrap: wrap; }
      .finalize button { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
<header>
  <div><h1>3D 에셋 검수</h1><p>4뷰 확인과 최종 판정은 서로 다른 단계입니다.</p></div>
  <div class="header-state" id="header-state">로컬 브리지 연결 중…</div>
</header>
<main><div id="app"></div></main>
<script>
let workflow=__WORKFLOW_JSON__;
const generated="__GENERATED_UTC__";
const views=[['front','정면'],['side','측면'],['top','상단'],['contact','접촉 확대']];
const reviewed=new Set();
const decisions=new Map();
const comments=new Map();
let selectedGroupId='';
let evidenceMode=false;
let nonce='';
let actionMessage='';

const reviewableStatus=new Set(['AwaitingHumanReview','TechnicalFailed','UnableToJudge','RevisionRequested']);
const toFileUrl=p=>'file:///'+encodeURI(String(p||'').replaceAll('\\','/'));
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const familyKey=item=>[item.geometryFamilyHash||`single:${item.id}`,item.template||'',item.status].join('|');
const imageUrl=(item,index,evidence)=>location.protocol==='file:'?toFileUrl((evidence?item.evidencePaths:item.rawPaths)[index]):`/api/spatial/workflow/image/${encodeURIComponent(item.id)}/${views[index][0]}?evidence=${evidence?1:0}&hash=${item.captureHash}`;

function reviewGroups(){
  const reviewable=workflow.items.filter(item=>reviewableStatus.has(item.status));
  return Object.values(reviewable.reduce((groups,item)=>{const key=familyKey(item);(groups[key]??=[]).push(item);return groups},{})).map(items=>{
    const canonical=items.find(item=>item.id===item.geometryFamilyCanonicalId);
    return {id:encodeURIComponent(familyKey(items[0])),items,representative:canonical||items[0]};
  });
}
function familyMembers(group){
  const item=group.representative;
  if(!item.geometryFamilyHash)return group.items;
  return workflow.items.filter(value=>value.geometryFamilyHash===item.geometryFamilyHash&&value.template===item.template);
}
function bucket(group){
  if(decisions.get(group.id)==='Approved')return 'approval';
  if(group.items.some(item=>['RevisionRequested','TechnicalFailed'].includes(item.status)))return 'revision';
  return 'undecided';
}
function grouped(groups){return {
  approval:groups.filter(group=>bucket(group)==='approval'),
  revision:groups.filter(group=>bucket(group)==='revision'),
  undecided:groups.filter(group=>bucket(group)==='undecided')
}}
function groupName(group){return group.representative.displayName||group.representative.id;}
function metrics(item){return (item.contacts||[]).flatMap(contact=>[
  `<span class="metric">${escapeHtml(contact.ruleId)} 간격 <b>${Number(contact.gap).toFixed(4)}m</b></span>`,
  `<span class="metric">관통 <b>${Number(contact.penetration).toFixed(4)}m</b></span>`,
  `<span class="metric">지지 <b>${Math.round(Number(contact.support)*100)}%</b></span>`]).join('');}
function statusLabel(group){
  const value=bucket(group);
  if(value==='approval')return '승인 예정';
  if(value==='revision')return '수정 필요';
  if(group.representative.status==='UnableToJudge')return '판단 불가';
  return '미판정';
}
function listRows(groups,kind,compact=false){
  if(!groups.length)return `<div class="${compact?'inbox-empty':'overview-empty'}">항목이 없습니다.</div>`;
  return groups.map(group=>`<button class="${compact?'inbox-row':'overview-row'} ${kind} ${selectedGroupId===group.id?'selected':''}" data-select="${group.id}"><span class="dot ${kind}"></span><span class="name">${escapeHtml(groupName(group))}</span></button>`).join('');
}
function detail(group){
  if(!group)return `<section class="detail empty">현재 사용자 검수 대기 항목이 없습니다.</section>`;
  const item=group.representative;
  const state=bucket(group);
  const isReviewed=reviewed.has(group.id);
  const awaiting=group.items.every(value=>value.status==='AwaitingHumanReview');
  const members=familyMembers(group);
  const canonical=workflow.items.find(value=>value.id===item.geometryFamilyCanonicalId);
  const family=members.length>1?`<div class="family"><strong>동일 공간 모델 ${members.length}개</strong>${members.map(value=>`<span class="variant">${escapeHtml(value.displayName)}</span>`).join('')}${canonical&&canonical.status==='Approved'?`<span>승인된 기준: ${escapeHtml(canonical.displayName)}</span>`:''}<span>재질·텍스처는 카탈로그에서 각각 유지됩니다.</span></div>`:'';
  const source=evidenceMode?'evidence':'raw';
  return `<section class="detail" data-group="${group.id}">
    <div class="state-banner ${state}"><span class="dot ${state}"></span>검수 중: ${statusLabel(group)}</div>
    <div class="case-head"><div><h2>${escapeHtml(groupName(group))}</h2><small>${escapeHtml(item.template||'관계 미확정')} · ${escapeHtml(item.assetId)}</small></div><span class="status">${escapeHtml(item.status)}</span><div class="mode"><button class="${source==='raw'?'active':''}" data-mode="raw">원본</button><button class="${source==='evidence'?'active':''}" data-mode="evidence">검사선</button></div></div>
    ${family}
    <div class="grid">${views.map(([id,label],index)=>`<figure class="view"><figcaption>${label}</figcaption><img src="${imageUrl(item,index,evidenceMode)}" alt="${label}"></figure>`).join('')}</div>
    <div class="measurements">${metrics(item)}</div>
    <p class="notice">${item.status==='TechnicalFailed'?(item.errors||[]).map(escapeHtml).join(' · '):`대기 계약 ${group.items.length}개 · 형상 ${escapeHtml(String(item.geometryFamilyHash||'개별').slice(0,15))} · 캡처 ${escapeHtml(String(item.captureHash||'').slice(0,8))}`}</p>
  </section>`;
}
function actionBar(group,groups){
  if(!group)return '';
  const isReviewed=reviewed.has(group.id);
  const awaiting=group.items.every(value=>value.status==='AwaitingHumanReview');
  const approvals=groups.filter(value=>decisions.get(value.id)==='Approved');
  const awaitingGroups=groups.filter(value=>value.items.every(item=>item.status==='AwaitingHumanReview'));
  const undecidedAwaiting=awaitingGroups.filter(value=>decisions.get(value.id)!=='Approved');
  const canFinalize=awaitingGroups.length>0&&undecidedAwaiting.length===0&&nonce;
  return `<section class="action-bar">
    <label class="review-note"><span><strong>검수 메모</strong>수정 필요 선택 시 필수</span><textarea data-comment="${group.id}" placeholder="예: 측면에서 벽과 횃불 사이가 떠 보임">${escapeHtml(comments.get(group.id)||'')}</textarea></label>
    <label class="review-check"><input type="checkbox" data-reviewed="${group.id}" ${isReviewed?'checked':''} ${awaiting?'':'disabled'}><span><strong>4뷰 확인 완료</strong><span>체크만으로 승인되지 않습니다</span></span></label>
    <button class="decision approval" data-plan="Approved" ${awaiting&&isReviewed?'':'disabled'}>${decisions.get(group.id)==='Approved'?'승인 예정 취소':'승인 예정'}</button>
    <button class="decision revision" data-decision="RevisionRequested" ${awaiting&&isReviewed?'':'disabled'}>수정 필요</button>
    <button class="decision" data-decision="UnableToJudge" ${awaiting&&isReviewed?'':'disabled'}>판단 불가</button>
    <div class="finalize"><span class="${actionMessage?'action-error':''}">${actionMessage?escapeHtml(actionMessage):(undecidedAwaiting.length?`아직 미판정 ${undecidedAwaiting.length}개가 있습니다.`:`승인 예정 ${approvals.length}개를 최종 저장할 수 있습니다.`)}</span><button id="finalize" ${canFinalize?'':'disabled'}>승인 예정 ${approvals.length}개 최종 저장</button></div>
  </section>`;
}
function render(){
  const groups=reviewGroups();
  if(!groups.some(group=>group.id===selectedGroupId))selectedGroupId=groups[0]?.id||'';
  const selected=groups.find(group=>group.id===selectedGroupId);
  const sets=grouped(groups);
  const approvedCount=workflow.items.filter(item=>item.status==='Approved').length;
  document.querySelector('#app').innerHTML=`
    <section class="overview" aria-label="전체 판정 현황">
      <div class="overview-head"><div class="overview-title approval">승인 예정 ${sets.approval.length}</div><div class="overview-title revision">수정 필요 ${sets.revision.length}</div><div class="overview-title undecided">미판정 ${sets.undecided.length}</div></div>
      <div class="overview-columns"><div class="overview-list">${listRows(sets.approval,'approval')}</div><div class="overview-list">${listRows(sets.revision,'revision')}</div><div class="overview-list">${listRows(sets.undecided,'undecided')}</div></div>
    </section>
    <div class="workspace"><aside class="inbox"><h2>검수 목록</h2>${[['approval','승인 예정'],['revision','수정 필요'],['undecided','미판정']].map(([kind,label])=>`<section class="group"><div class="group-head"><span class="dot ${kind}"></span>${label}<span class="count">${sets[kind].length}</span></div><div class="inbox-list">${listRows(sets[kind],kind,true)}</div></section>`).join('')}</aside>${detail(selected)}</div>
    ${actionBar(selected,groups)}`;
  document.querySelector('#header-state').innerHTML=`저장된 승인 <b>${approvedCount}</b> · 현재 검수 <b>${groups.length}</b>`;
  document.querySelectorAll('[data-select]').forEach(button=>button.onclick=()=>{selectedGroupId=button.dataset.select;evidenceMode=false;actionMessage='';render()});
  document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{evidenceMode=button.dataset.mode==='evidence';render()});
  document.querySelectorAll('[data-comment]').forEach(input=>input.oninput=()=>{comments.set(input.dataset.comment,input.value);actionMessage=''});
  document.querySelectorAll('[data-reviewed]').forEach(input=>input.onchange=()=>{input.checked?reviewed.add(input.dataset.reviewed):reviewed.delete(input.dataset.reviewed);if(!input.checked)decisions.delete(input.dataset.reviewed);render()});
  document.querySelectorAll('[data-plan]').forEach(button=>button.onclick=()=>{decisions.get(selectedGroupId)==='Approved'?decisions.delete(selectedGroupId):decisions.set(selectedGroupId,'Approved');render()});
  document.querySelectorAll('[data-decision]').forEach(button=>button.onclick=()=>decide(selectedGroupId,button.dataset.decision));
  const finalize=document.querySelector('#finalize');if(finalize)finalize.onclick=bulkApprove;
}
async function connect(){
  const state=document.querySelector('#header-state');
  for(let i=0;i<12;i++){
    try{
      const health=await fetch('http://127.0.0.1:4174/api/health');
      if(health.ok){
        const value=await health.json();nonce=value.nonce||'';
        const latest=await fetch('http://127.0.0.1:4174/api/spatial/workflow');
        if(latest.ok)workflow=await latest.json();
        render();return;
      }
    }catch{}
    state.textContent='로컬 브리지 연결 중…';
    await new Promise(resolve=>setTimeout(resolve,500));
  }
  state.textContent='로컬 브리지 연결 안 됨';render();
}
async function decide(groupId,decision){
  const group=reviewGroups().find(value=>value.id===groupId);
  if(!group||!nonce)return;
  const comment=String(comments.get(groupId)||'').trim();
  if(decision==='RevisionRequested'&&!comment){actionMessage='수정 필요 사유를 먼저 적어주세요.';render();return;}
  const buttons=document.querySelectorAll('.action-bar button,.action-bar input');buttons.forEach(control=>control.disabled=true);
  try{
    for(const item of group.items){
      const response=await fetch('http://127.0.0.1:4174/api/spatial/workflow/review',{method:'POST',headers:{'Content-Type':'application/json','X-Spatial-Review-Nonce':nonce},body:JSON.stringify({id:item.id,decision,captureHash:item.captureHash,reviewer:localStorage.getItem('spatial-reviewer')||'local-user',issues:[],comment:comment||'동일 형상군 사용자 판정'})});
      const result=await response.json();if(!response.ok)throw new Error(result.error||'판정 저장 실패');item.status=result.status;
    }
    decisions.delete(groupId);reviewed.delete(groupId);comments.delete(groupId);actionMessage='';render();
  }catch(error){alert(error.message);render();}
}
async function bulkApprove(){
  const groups=reviewGroups();
  const awaitingGroups=groups.filter(group=>group.items.every(item=>item.status==='AwaitingHumanReview'));
  if(!awaitingGroups.length||awaitingGroups.some(group=>decisions.get(group.id)!=='Approved')||!nonce)return;
  const button=document.querySelector('#finalize');button.disabled=true;button.textContent='최종 저장 중…';
  try{
    const items=awaitingGroups.flatMap(group=>group.items.map(item=>({id:item.id,captureHash:item.captureHash})));
    const response=await fetch('http://127.0.0.1:4174/api/spatial/workflow/review-batch',{method:'POST',headers:{'Content-Type':'application/json','X-Spatial-Review-Nonce':nonce},body:JSON.stringify({decision:'Approved',reviewer:localStorage.getItem('spatial-reviewer')||'local-user',items,comment:'각 형상군의 4뷰 확인 및 승인 예정 판정 후 최종 저장.'})});
    const result=await response.json();if(!response.ok)throw new Error(result.error||'일괄 승인 저장 실패');
    const ids=new Set(items.map(item=>item.id));workflow.items.filter(item=>ids.has(item.id)).forEach(item=>item.status='Approved');
    awaitingGroups.forEach(group=>{decisions.delete(group.id);reviewed.delete(group.id)});render();
  }catch(error){alert(error.message);render();}
}
render();connect();
</script>
